packaging_format = 2

id = "scrutiny"
name = "Scrutiny"
description.en = "WebUI for smartd S.M.A.R.T monitoring"

version = "0.10.0~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "MIT"
admindoc = "https://github.com/AnalogJ/scrutiny/tree/master/docs"
code = "https://github.com/AnalogJ/scrutiny"
fund = "https://paypal.me/analogj/usd10"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.path]
	type = "path"
	default = "/scrutiny"

	[install.collector]
	ask.en = "Should the collector be activated on this host?"
	help.en = "Let it to true if yunohost is running on bare metal (i.e. not in a VM or in a LXC)"
	type = "boolean"
	default = true

[resources]
	[resources.sources]

		[resources.sources.main]
		in_subdir = false
		rename = "scrutiny-web-linux"
		amd64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.10.0/scrutiny-web-linux-amd64"
		amd64.sha256 = "aef180aa5187f77567d670310a7574a90d09cbda19b72540134eb32cd66bcdb0"
		arm64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.10.0/scrutiny-web-linux-arm64"
		arm64.sha256 = "e066b818c1239c98f71a2d6354ef967011421ae1ef6e5d0f1ade2d45306a68c8"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset.amd64 = "^scrutiny-web-linux-amd64$"
		autoupdate.asset.arm64 = "^scrutiny-web-linux-arm64$"

		[resources.sources.scrutiny-collector-metrics-linux]
		in_subdir = false
		rename = "scrutiny-collector-metrics-linux"
		amd64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.10.0/scrutiny-collector-metrics-linux-amd64"
		amd64.sha256 = "d1d5180b10b2c183670c931c38ae149544627a0525640664b754d3a0fc48a5ad"
		arm64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.10.0/scrutiny-collector-metrics-linux-arm64"
		arm64.sha256 = "8b50d2bdbe67860e6c65549a58ac00640a864ed8453b2d085d4d1a71112c48f2"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset.amd64 = "^scrutiny-collector-metrics-linux-amd64$"
		autoupdate.asset.arm64 = "^scrutiny-collector-metrics-linux-arm64$"

		[resources.sources.scrutiny-web-frontend]
		in_subdir = true
		url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.10.0/scrutiny-web-frontend.tar.gz"
		sha256 = "344fe65088295f07d9edbc94f278dd4b09912c65a8b8958532f273c25b772a56"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset = "^scrutiny-web-frontend.tar.gz$"

	[resources.system_user]

	[resources.install_dir]

	[resources.data_dir]

	[resources.permissions]
	main.url = "/"
	main.auth_header = false
	main.show_tile = true
	main.protected= true
	main.allowed = "admins"
	api.url = "re:__DOMAIN____PATH__/api/devices?/.*"
	api.allowed = "visitors"
	api.auth_header = false
	api.show_tile = false
	api.protected= true

	[resources.ports]
	main.default = 8080

	[resources.apt]
	packages = "smartmontools"
