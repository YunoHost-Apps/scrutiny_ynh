packaging_format = 2

id = "scrutiny"
name = "Scrutiny"
description.en = "WebUI for smartd S.M.A.R.T monitoring"

version = "0.9.4~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "MIT"
admindoc = "https://github.com/AnalogJ/scrutiny/tree/master/docs"
code = "https://github.com/AnalogJ/scrutiny"
fund = "https://paypal.me/analogj/usd10"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.path]
	type = "path"
	default = "/scrutiny"

	[install.collector]
	ask.en = "Should the collector be activated on this host?"
	help.en = "Let it to true if yunohost is running on bare metal (i.e. not in a VM or in a LXC)"
	type = "boolean"
	default = true

[resources]
	[resources.sources]

		[resources.sources.main]
		in_subdir = false
		rename = "scrutiny-web-linux"
		amd64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.4/scrutiny-web-linux-amd64"
		amd64.sha256 = "223e829ba3efd6b51387ef08f8261ce098965a6b9b7fa0ce6d0b8acd6672f0dd"
		arm64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.4/scrutiny-web-linux-arm64"
		arm64.sha256 = "c333a465ea2f7c92bc632727a1fa8081233e0746cca1ce0347781163dbbe4c39"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset.amd64 = "^scrutiny-web-linux-amd64$"
		autoupdate.asset.arm64 = "^scrutiny-web-linux-arm64$"

		[resources.sources.scrutiny-collector-metrics-linux]
		in_subdir = false
		rename = "scrutiny-collector-metrics-linux"
		amd64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.4/scrutiny-collector-metrics-linux-amd64"
		amd64.sha256 = "86d2c991864568f8fb018dab949073d7360a062f6d2802fc624e5f589cbcb0fd"
		arm64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.4/scrutiny-collector-metrics-linux-arm64"
		arm64.sha256 = "3d575abac478e8650528c1aa1643e5d2f9e4789b7d225dbbccb548fdc6c27cc3"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset.amd64 = "^scrutiny-collector-metrics-linux-amd64$"
		autoupdate.asset.arm64 = "^scrutiny-collector-metrics-linux-arm64$"

		[resources.sources.scrutiny-web-frontend]
		in_subdir = true
		url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.4/scrutiny-web-frontend.tar.gz"
		sha256 = "e40d62623f7fdbf945cfcd3c37b27ae31d49559bb646a0b461d95304f8be1a2d"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset = "^scrutiny-web-frontend.tar.gz$"

	[resources.system_user]

	[resources.install_dir]

	[resources.data_dir]

	[resources.permissions]
	main.url = "/"
	main.auth_header = false
	main.show_tile = true
	main.protected= true
	main.allowed = "admins"
	api.url = "re:__DOMAIN____PATH__/api/devices?/.*"
	api.allowed = "visitors"
	api.auth_header = false
	api.show_tile = false
	api.protected= true

	[resources.ports]
	main.default = 8080

	[resources.apt]
	packages = "smartmontools"
