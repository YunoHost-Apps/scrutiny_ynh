packaging_format = 2

id = "scrutiny"
name = "Scrutiny"
description.en = "WebUI for smartd S.M.A.R.T monitoring"

version = "0.9.5~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "MIT"
admindoc = "https://github.com/AnalogJ/scrutiny/tree/master/docs"
code = "https://github.com/AnalogJ/scrutiny"
fund = "https://paypal.me/analogj/usd10"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.path]
	type = "path"
	default = "/scrutiny"

	[install.collector]
	ask.en = "Should the collector be activated on this host?"
	help.en = "Let it to true if yunohost is running on bare metal (i.e. not in a VM or in a LXC)"
	type = "boolean"
	default = true

[resources]
	[resources.sources]

		[resources.sources.main]
		in_subdir = false
		rename = "scrutiny-web-linux"
		amd64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.5/scrutiny-web-linux-amd64"
		amd64.sha256 = "b42e2c702854e7ef852dbc64b5d2ac0113b8e19cd1196d7164d119f3b0442f3c"
		arm64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.5/scrutiny-web-linux-arm64"
		arm64.sha256 = "667ecfa78a11bed0481e5db2f75a07de1150837c40d11250eeb5e1eba559c381"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset.amd64 = "^scrutiny-web-linux-amd64$"
		autoupdate.asset.arm64 = "^scrutiny-web-linux-arm64$"

		[resources.sources.scrutiny-collector-metrics-linux]
		in_subdir = false
		rename = "scrutiny-collector-metrics-linux"
		amd64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.5/scrutiny-collector-metrics-linux-amd64"
		amd64.sha256 = "a7745fe3d4282857be07089298a4fa29b1f34e50fc7cc1c054b2945dd9edc320"
		arm64.url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.5/scrutiny-collector-metrics-linux-arm64"
		arm64.sha256 = "690a9fc743480a8c83b3c8c5c7dedc437a7ec434dad5bc63153f70e8b72cd845"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset.amd64 = "^scrutiny-collector-metrics-linux-amd64$"
		autoupdate.asset.arm64 = "^scrutiny-collector-metrics-linux-arm64$"

		[resources.sources.scrutiny-web-frontend]
		in_subdir = true
		url = "https://github.com/AnalogJ/scrutiny/releases/download/v0.9.5/scrutiny-web-frontend.tar.gz"
		sha256 = "0c895ede4ac9d93ba549c5dedc7dcfd7c82b593bb37f2ae91fffce9cc16d9763"

		autoupdate.strategy = "latest_github_release"
		autoupdate.asset = "^scrutiny-web-frontend.tar.gz$"

	[resources.system_user]

	[resources.install_dir]

	[resources.data_dir]

	[resources.permissions]
	main.url = "/"
	main.auth_header = false
	main.show_tile = true
	main.protected= true
	main.allowed = "admins"
	api.url = "re:__DOMAIN____PATH__/api/devices?/.*"
	api.allowed = "visitors"
	api.auth_header = false
	api.show_tile = false
	api.protected= true

	[resources.ports]
	main.default = 8080

	[resources.apt]
	packages = "smartmontools"
